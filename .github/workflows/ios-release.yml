name: iOS Release (TestFlight)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload the built .ipa to App Store Connect / TestFlight'
        required: true
        default: true
        type: boolean

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache + daemon)
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-2.4.10
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Import signing certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          CERT_PW="${{ secrets.APPLE_CERT_PASSWORD }}"
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$CERT_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$CERT_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PW" -A -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERT_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security show-keychain-info "$KEYCHAIN"

      - name: Install provisioning profile
        run: |
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode > "$RUNNER_TEMP/ZWL.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/ZWL.mobileprovision" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/ZWL.mobileprovision" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/ZWL.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          printf 'PROFILE_UUID=%s\nPROFILE_NAME=%s\n' "$PROFILE_UUID" "$PROFILE_NAME" >> "$RUNNER_TEMP/ios.env"
          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: iosApp

      - name: Archive (device signing)
        run: |
          source "$RUNNER_TEMP/ios.env"
          IDENTITY=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Apple Distribution:.*\)"/\1/p' | head -n 1)
          echo "Using identity: $IDENTITY"
          xcodebuild archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZWL.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGNING_REQUIRED=YES
        working-directory: iosApp

      - name: Export IPA
        run: |
          source "$RUNNER_TEMP/ios.env"
          mkdir -p build/export
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>method</key>' \
            '  <string>app-store</string>' \
            '  <key>signingStyle</key>' \
            '  <string>manual</string>' \
            '  <key>teamID</key>' \
            '  <string>TEMPLATE_TEAM_ID</string>' \
            '  <key>provisioningProfiles</key>' \
            '  <dict>' \
            '    <key>com.indiana.zwl.iosApp</key>' \
            '    <string>TEMPLATE_PROFILE_NAME</string>' \
            '  </dict>' \
            '  <key>manageAppVersionAndBuildNumber</key>' \
            '  <false/>' \
            '  <key>uploadBitcode</key>' \
            '  <false/>' \
            '  <key>compileBitcode</key>' \
            '  <false/>' \
            '</dict>' \
            '</plist>' \
            > build/exportOptions.plist
          sed -i '' "s/TEMPLATE_TEAM_ID/$TEAM_ID/" build/exportOptions.plist
          sed -i '' "s/TEMPLATE_PROFILE_NAME/$PROFILE_NAME/" build/exportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/ZWL.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/exportOptions.plist
          ls -la build/export
        working-directory: iosApp

      - name: Upload to App Store Connect (TestFlight)
        if: ${{ inputs.upload_to_testflight }}
        run: |
          for dir in "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys"; do
            mkdir -p "$dir"
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$dir/AuthKey_${KEY_ID}.p8"
            chmod 600 "$dir/AuthKey_${KEY_ID}.p8"
          done
          xcrun altool \
            --upload-app \
            -f build/export/ZWL.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose
        working-directory: iosApp
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      - name: Upload artifacts (.ipa + .xcarchive)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZWL-release
          path: |
            iosApp/build/export/ZWL.ipa
            iosApp/build/ZWL.xcarchive
          if-no-files-found: warn