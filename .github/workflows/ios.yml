name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (cache + daemon)
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-2.4.10
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Compile shared framework (iosSimulatorArm64)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: iosApp

      - name: Build app (simulator)
        run: |
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64
        working-directory: iosApp

      - name: Run XCTest unit tests (simulator)
        run: |
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data.get('devices', {}).values():
              for device in devices:
                  if device.get('isAvailable'):
                      print(device['name'])
                      sys.exit(0)
          " )
          echo "Selected simulator: $SIM_NAME"
          xcodebuild test \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/DerivedData/ZWL.xcresult
        working-directory: iosApp

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZWL-simulator-app
          path: iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/ZWL.app
          if-no-files-found: error

      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZWL-xcresult
          path: iosApp/build/DerivedData/ZWL.xcresult
          if-no-files-found: warn